version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: leaddesk-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-leaddesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leaddesk_secret}
      POSTGRES_DB: ${DB_NAME:-leaddesk_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-leaddesk} -d ${DB_NAME:-leaddesk_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - leaddesk-network

  backend:
    build:
      context: ../leaddesk-backend
      dockerfile: Dockerfile
    container_name: leaddesk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-4000}
      DATABASE_URL: postgresql://${DB_USER:-leaddesk}:${DB_PASSWORD:-leaddesk_secret}@postgres:5432/${DB_NAME:-leaddesk_dev}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-access_secret_for_local_dev_only_32_chars_min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-refresh_secret_for_local_dev_only_32_chars_min}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-30d}
      INITIAL_OWNER_EMAIL: ${INITIAL_OWNER_EMAIL:-lead@example.com}
      INITIAL_OWNER_PASSWORD: ${INITIAL_OWNER_PASSWORD:-ChangeMeImmediately123!}
      INITIAL_OWNER_NAME: ${INITIAL_OWNER_NAME:-Team Lead}
      INITIAL_OWNER_TIMEZONE: ${INITIAL_OWNER_TIMEZONE:-Asia/Karachi}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ../leaddesk-backend:/app
      - /app/node_modules
      - backend_uploads:/app/uploads
    networks:
      - leaddesk-network

  frontend:
    build:
      context: ../leaddesk-frontend
      dockerfile: Dockerfile
    container_name: leaddesk-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    networks:
      - leaddesk-network

networks:
  leaddesk-network:
    driver: bridge

volumes:
  postgres_data:
  backend_uploads:
